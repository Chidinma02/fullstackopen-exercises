name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: part11/pokedex
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies 
        run: npm install  
      - name: Check style
        run: npm run eslint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Trigger deployment
        if: github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip')
        run: curl -s "$RENDER_DEPLOY_HOOK_URL"
      - name: Health check
        if: github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip')
        run: curl -fsS --retry 5 --retry-delay 5 https://fullstackopen-exercises-2-tu7d.onrender.com/health
      - name: Discord Success Notification
        if: success() && github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip')
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          content: "A new version of Pokedex deployed!"
          title: "Deployment Succeeded"
          description: "Commit [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) by ${{ github.actor }} was successfully deployed to Render."
      - name: Discord Failure Notification
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          content: "Build failed!"
          title: "Build Failed"
          description: "Commit [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) by ${{ github.actor }} failed the build."

 

  tag_release:
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch


