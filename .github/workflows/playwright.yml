name: End-to-End Tests

on:
  push:
    branches: [ main, master, changes ]
  pull_request:
    branches: [ main, master, changes ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: part14/bloglist

    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/test_db?sslmode=disable' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'super-secret-key-for-fullstackopen' }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: part14/bloglist/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('part14/bloglist/package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Set up environment file
        run: |
          echo "DATABASE_URL=${DATABASE_URL}" > .env.test
          echo "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}" >> .env.test
          echo "NEXTAUTH_URL=${NEXTAUTH_URL}" >> .env.test
          echo "NODE_ENV=test" >> .env.test

      - name: Verify environment setup
        run: |
          echo "### Environment Verification" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "✅ Using custom \`DATABASE_URL\` from repository secrets." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ \`DATABASE_URL\` secret not provided; using built-in PostgreSQL test service container." >> $GITHUB_STEP_SUMMARY
          fi
          echo "- NEXTAUTH_SECRET configured: true" >> $GITHUB_STEP_SUMMARY
          echo "- NEXTAUTH_URL: ${NEXTAUTH_URL}" >> $GITHUB_STEP_SUMMARY

      - name: Run database migrations
        run: |
          npx drizzle-kit push --force 2>&1 | tee migration.log

      - name: Report migration error if failed
        if: failure()
        run: |
          echo "### Database Migration Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f migration.log ]; then
            cat migration.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No migration log generated." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: part14/bloglist/playwright-report/
          retention-days: 30
