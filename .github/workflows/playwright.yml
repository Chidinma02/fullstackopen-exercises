name: End-to-End Tests

on:
  push:
    branches: [ main, master, changes ]
  pull_request:
    branches: [ main, master, changes ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: part14/bloglist

    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'super-secret-key-for-fullstackopen' }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: part14/bloglist/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('part14/bloglist/package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Set up environment file
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.test
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET || 'super-secret-key-for-fullstackopen' }}" >> .env.test
          echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}" >> .env.test
          echo "NODE_ENV=test" >> .env.test

      - name: Verify environment setup
        run: |
          echo "### Environment Verification" >> $GITHUB_STEP_SUMMARY
          echo "- DATABASE_URL secret exists: ${{ secrets.DATABASE_URL != '' }}" >> $GITHUB_STEP_SUMMARY
          echo "- NEXTAUTH_SECRET secret exists: ${{ secrets.NEXTAUTH_SECRET != '' }}" >> $GITHUB_STEP_SUMMARY
          echo "- NEXTAUTH_URL secret exists: ${{ secrets.NEXTAUTH_URL != '' }}" >> $GITHUB_STEP_SUMMARY
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "❌ **ERROR**: \`DATABASE_URL\` secret is missing in GitHub repository secrets!" >> $GITHUB_STEP_SUMMARY
            echo "Please go to repository Settings -> Secrets and variables -> Actions and add DATABASE_URL." >> $GITHUB_STEP_SUMMARY
            echo "::error::DATABASE_URL secret is missing in GitHub repository secrets! Please add it under Settings -> Secrets and variables -> Actions."
            exit 1
          else
            echo "✅ \`DATABASE_URL\` is present." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run database migrations
        run: |
          npx drizzle-kit push --force 2>&1 | tee migration.log

      - name: Report migration error if failed
        if: failure()
        run: |
          echo "### Database Migration Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f migration.log ]; then
            cat migration.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No migration log generated." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: part14/bloglist/playwright-report/
          retention-days: 30
